allowBuilds:
  esbuild: false

# Exclude specific package versions from the minimum release age restriction.
# These versions can be installed immediately without waiting for the configured age threshold.
# 최소 배포 경과 시간 조건을 적용하지 않고 설치하도록 예외 처리하는 설정
minimumReleaseAgeExclude:
  - '@vercel/build-utils@15.2.0'
  - '@vercel/node@29.0.0'

# 보안 패치 적용 (의존성 취약점 대응)
overrides:
  body-parser: '>=2.4.0'
  '@vercel/node>path-to-regexp': '6.3.0'
  '@vercel/node>undici': '6.29.1'
  '@vercel/static-config>ajv': '8.20.0'